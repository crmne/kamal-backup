AllCops:
  NewCops: disable
  TargetRubyVersion: 3.2
  SuggestExtensions: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Layout/LineLength:
  Max: 160

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Style/Documentation:
  Enabled: false
